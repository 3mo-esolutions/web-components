name: 🔍 Quality Assurance

on:
  workflow_dispatch:
  workflow_call:

jobs:
  type-check:
    name: 🏗️ Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: 'npm'
      - run: npm ci
      - run: npm run typescript

  lint:
    name: 📝 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run peers

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    # Ships the browsers' system libraries, which `--with-deps` would fetch through the runner's slow apt mirror
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      # Firefox refuses to start as root under another user's home
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install chromium firefox
      - run: npm test -- --all
